name: release

# Cut a GitHub Release + tag only after an explicit maintainer dispatch.
#
# VERSION.md is the single source of truth for the version (see manifests.yml).
# A maintainer must dispatch this workflow from main and type the exact declared
# version. The workflow then creates tag v<version> at the selected main commit
# and a release whose body is the matching
# "Changes in v<version>:" changelog block. It is idempotent: if the tag/release
# already exists, it does nothing. A push or VERSION.md edit can never trigger
# this workflow. The default marketplace resolves the matching versioned tag;
# `main` remains the explicitly documented edge channel.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Exact VERSION.md value to release (for example, 3.2.0)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  validate:
    name: validate release candidate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install release-candidate validation dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-controller.txt

      - name: Smoke-test the exact release archive
        run: bash scripts/package-smoke.sh . "" git

      - name: Resolve validated version
        id: version
        shell: bash
        run: |
          version="$(awk '/^Version:[[:space:]]+[0-9]+\.[0-9]+\.[0-9]+[[:space:]]*$/ { print $2; exit }' VERSION.md | tr -d '\r')"
          if [ -z "$version" ]; then
            echo "::error file=VERSION.md::could not resolve validated version"
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

  release:
    name: cut release from VERSION.md
    needs: validate
    if: github.ref == 'refs/heads/main' && needs.validate.outputs.version == inputs.version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the tag and the release
    steps:
      - name: Create release if VERSION.md declares a new version
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ github.sha }}
          DECLARED_VERSION: ${{ needs.validate.outputs.version }}
          REQUESTED_VERSION: ${{ inputs.version }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail

          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::.github/workflows/release.yml must be dispatched from main, got $GITHUB_REF"
            exit 1
          fi

          version="$DECLARED_VERSION"
          if ! printf '%s\n' "$version" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error file=VERSION.md::validated job supplied an invalid version"
            exit 1
          fi
          if [ "$REQUESTED_VERSION" != "$version" ]; then
            echo "::error file=VERSION.md::requested version '$REQUESTED_VERSION' does not match VERSION.md '$version'"
            exit 1
          fi
          tag="v$version"

          # Idempotent: do nothing if this version was already released (e.g. the
          # push only edited the changelog wording, not the version).
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists — nothing to do."
            exit 0
          fi

          # The write-capable job never checks out or runs repository code. Fetch
          # only the validated commit's VERSION.md after all authorization checks.
          if ! gh api \
            -H 'Accept: application/vnd.github.raw+json' \
            "repos/$REPO/contents/VERSION.md?ref=$COMMIT_SHA" \
            > VERSION.md; then
            echo "::error file=VERSION.md::could not fetch VERSION.md at $COMMIT_SHA"
            exit 1
          fi
          fetched_version="$(awk '/^Version:[[:space:]]+[0-9]+\.[0-9]+\.[0-9]+[[:space:]]*$/ { print $2; exit }' VERSION.md | tr -d '\r')"
          if [ "$fetched_version" != "$version" ]; then
            echo "::error file=VERSION.md::validated version '$version' does not match commit '$fetched_version'"
            exit 1
          fi

          # Release notes = the 'Changes in v<version>:' block from VERSION.md, up
          # to the next 'Changes in v' heading.
          notes="$(awk -v hdr="Changes in v$version:" \
            'index($0,hdr)==1{g=1;next} g&&/^Changes in v[0-9]/{exit} g{print}' \
            VERSION.md | sed '/^[[:space:]]*$/d')"
          if [ -z "$notes" ]; then
            notes="Release $tag."
          fi
          {
            printf '%s\n\n' "$notes"
            printf 'Full changelog: [`VERSION.md`](https://github.com/%s/blob/main/VERSION.md).\n' "$REPO"
          } > release-notes.md

          # (DX-1) The run block uses `set -uo pipefail` (no -e), so a failed
          # `gh release create` would otherwise fall through to the success echo and
          # the step would go green without cutting the release. Check its exit code so
          # a failure fails the step.
          if ! gh release create "$tag" \
            --target "$COMMIT_SHA" \
            --title "Pathfinder $tag" \
            --notes-file release-notes.md; then
            echo "::error file=VERSION.md::gh release create failed for $tag — no release/tag was cut"
            exit 1
          fi
          echo "Created release $tag at $COMMIT_SHA"
