name: prepare-v3.3.0

on:
  push:
    branches: [release/v3.3.0-hardening]

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: release/v3.3.0-hardening

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes jq shellcheck
          python -m pip install --disable-pip-version-check -r requirements-controller.txt

      - name: Apply the bounded v3.3.0 hardening change set
        run: python .github/pathfinder-v330-prepare.py

      - name: Run the complete repository gate
        env:
          PATHFINDER_CONTROLLER_PYTHON: python
          PATHFINDER_DOCS_PYTHON: python
          PATHFINDER_EVAL_PYTHON: python
        run: bash scripts/check-all.sh .

      - name: Commit the verified candidate
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Harden mission integrity and read-only operations for v3.3.0'

      - name: Smoke-test the exact committed package
        env:
          PATHFINDER_CONTROLLER_PYTHON: python
          PATHFINDER_DOCS_PYTHON: python
          PATHFINDER_EVAL_PYTHON: python
        run: bash scripts/package-smoke.sh .

      - name: Push the verified implementation
        run: git push origin HEAD:release/v3.3.0-hardening

      - name: Open the v3.3.0 pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh pr view release/v3.3.0-hardening --json url >/tmp/pr.json 2>/dev/null; then
            cat /tmp/pr.json
          else
            gh pr create \
              --base main \
              --head release/v3.3.0-hardening \
              --title 'Harden mission integrity and read-only operations for v3.3.0' \
              --body-file - <<'EOF'
          ## Summary

          - makes mission status strictly read-only and introduces explicit locked repair
          - verifies transition payload, identity, sequence, allowed fields, state hashes, and event chaining
          - prevents read-only Git inspection from refreshing the index
          - degrades corrupt discovery cache entries to safe cache misses
          - clarifies capability reporting and hardens local privacy and atomic durability

          ## Verification

          - `bash scripts/check-all.sh .`
          - `bash scripts/package-smoke.sh .` against the exact committed artifact

          ## Release

          This pull request prepares the deliberate manual release of Pathfinder v3.3.0 after all protected-branch checks pass.
          EOF
          fi
