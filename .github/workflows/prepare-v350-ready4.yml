name: prepare-v3.5.0-ready4

on:
  push:
    branches: [codex/pathfinder-hardening-outcomes]
    paths: [.github/workflows/prepare-v350-ready4.yml]

permissions:
  contents: write
  issues: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 85
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      READY_BRANCH: release/v3.5.0-ready4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: codex/pathfinder-hardening-outcomes

      - name: Preserve the bounded preparation programs
        run: |
          cp .github/pathfinder-v350-prepare.py /tmp/pathfinder-v350-prepare.py
          cp .github/pathfinder-v350-fixup.py /tmp/pathfinder-v350-fixup.py
          cp .github/pathfinder-v350-fixup2.py /tmp/pathfinder-v350-fixup2.py
          cp .github/pathfinder-v350-fixup3.py /tmp/pathfinder-v350-fixup3.py

      - name: Wait for v3.4.0 to be published
        run: |
          set -euo pipefail
          for attempt in $(seq 1 450); do
            if gh release view v3.4.0 --repo "$REPO" >/dev/null 2>&1; then
              exit 0
            fi
            sleep 10
          done
          echo 'v3.4.0 was not published within the dependency window' >&2
          exit 1

      - name: Rebuild from the released default branch
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B "$READY_BRANCH" origin/main
          test "$(sed -n 's/^Version:[[:space:]]*//p' VERSION.md | head -1)" = '3.4.0'

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install baseline tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes jq shellcheck
          python -m pip install --disable-pip-version-check -r requirements-controller.txt

      - name: Apply the architecture change set and all quality fixups
        run: |
          set -euo pipefail
          python /tmp/pathfinder-v350-prepare.py
          python /tmp/pathfinder-v350-fixup.py
          python /tmp/pathfinder-v350-fixup2.py
          python /tmp/pathfinder-v350-fixup3.py
          python -m pip install --disable-pip-version-check -r requirements-dev.txt
          bash scripts/format-python-quality-surface.sh .

      - name: Verify, commit, and package v3.5.0
        env:
          PATHFINDER_CONTROLLER_PYTHON: python
          PATHFINDER_DOCS_PYTHON: python
          PATHFINDER_EVAL_PYTHON: python
        run: |
          set -euo pipefail
          bash scripts/check-all.sh .
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Add progressive policy-driven architecture and quality gates for v3.5.0'
          bash scripts/package-smoke.sh .
          bash scripts/check-wheel.sh .
          git push --force-with-lease origin HEAD:"$READY_BRANCH"

      - name: Record preparation failure
        if: failure()
        run: |
          gh issue create --repo "$REPO" --title 'v3.5.0 quality-clean ready preparation failed' \
            --body "Workflow: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID

          No pull request, merge, or release was attempted." || true
