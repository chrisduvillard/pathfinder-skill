name: finalize-v3.5.0-ready7

on:
  push:
    branches: [codex/pathfinder-hardening-outcomes]
    paths: [.github/workflows/finalize-v350-ready7.yml]

permissions:
  actions: write
  checks: read
  contents: write
  issues: write
  pull-requests: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 130
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      HEAD_BRANCH: release/v3.5.0-ready7
      VERSION: 3.5.0
    steps:
      - name: Wait for PR or completed release
        id: pr
        run: |
          set -euo pipefail
          for attempt in $(seq 1 630); do
            number=$(gh pr list --repo "$REPO" --head "$HEAD_BRANCH" --state open --json number --limit 1 --jq '.[0].number // empty' 2>/dev/null || true)
            if [ -n "$number" ]; then echo "number=$number" >> "$GITHUB_OUTPUT"; exit 0; fi
            if gh release view "v$VERSION" --repo "$REPO" >/dev/null 2>&1; then echo "released=true" >> "$GITHUB_OUTPUT"; exit 0; fi
            sleep 10
          done
          exit 1

      - name: Wait for registered checks, require green, and merge
        if: steps.pr.outputs.released != 'true'
        run: |
          set -euo pipefail
          pr='${{ steps.pr.outputs.number }}'
          for attempt in $(seq 1 360); do
            checks=$(gh pr checks "$pr" --repo "$REPO" --json name,state,bucket 2>/dev/null || echo '[]')
            names=$(jq -r '.[].name' <<<"$checks")
            if grep -qx 'version + JSON consistency' <<<"$names" \
              && grep -qx 'CodeQL' <<<"$names" \
              && grep -qx 'CodeQL Actions' <<<"$names" \
              && grep -qx 'Dependency Review' <<<"$names"; then
              break
            fi
            sleep 10
          done
          gh pr checks "$pr" --repo "$REPO" --watch --fail-fast --interval 10
          files=$(gh pr diff "$pr" --repo "$REPO" --name-only)
          ! grep -Eq '^\.github/(pathfinder-v350-(prepare|fixup|fixup2|fixup3|fixup4|fixup5)\.py|workflows/(prepare|orchestrate|finalize)-v350.*\.yml)$' <<<"$files"
          gh pr merge "$pr" --repo "$REPO" --squash --delete-branch --subject 'Add progressive policy-driven architecture and quality gates for v3.5.0'

      - name: Dispatch and verify release
        run: |
          set -euo pipefail
          gh release view "v$VERSION" --repo "$REPO" >/dev/null 2>&1 && exit 0
          merged_sha=$(gh api "repos/$REPO/commits/main" --jq .sha)
          [ "$(gh api "repos/$REPO/contents/VERSION.md?ref=main" --jq .content | base64 -d | sed -n 's/^Version:[[:space:]]*//p' | head -1)" = "$VERSION" ]
          started=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          gh workflow run release.yml --repo "$REPO" --ref main -f version="$VERSION"
          run_id=''
          for attempt in $(seq 1 90); do
            runs=$(gh run list --repo "$REPO" --workflow release.yml --event workflow_dispatch --branch main --limit 10 --json databaseId,createdAt)
            run_id=$(jq -r --arg started "$started" '[.[] | select(.createdAt >= $started)] | sort_by(.createdAt) | last | .databaseId // empty' <<<"$runs")
            [ -n "$run_id" ] && break
            sleep 5
          done
          [ -n "$run_id" ]
          gh run watch "$run_id" --repo "$REPO" --exit-status
          [ "$(gh api "repos/$REPO/git/ref/tags/v$VERSION" --jq .object.sha)" = "$merged_sha" ]

      - name: Record failure
        if: failure()
        run: gh issue create --repo "$REPO" --title 'v3.5.0 finalizer blocked' --body "Workflow: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" || true
