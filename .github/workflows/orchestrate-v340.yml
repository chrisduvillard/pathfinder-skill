name: orchestrate-v3.4.0

on:
  push:
    branches: [codex/pathfinder-hardening-outcomes]
    paths: [.github/workflows/orchestrate-v340.yml]

permissions:
  actions: write
  checks: read
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      HEAD_BRANCH: release/v3.4.0-semantic
      VERSION: 3.4.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: codex/pathfinder-hardening-outcomes
          fetch-depth: 0

      - name: Preserve the controller-only preparation script
        run: cp .github/pathfinder-v340-prepare.py /tmp/pathfinder-v340-prepare.py

      - name: Wait for v3.3.0 to be published
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 270); do
            if gh release view v3.3.0 --repo "$REPO" >/dev/null 2>&1; then
              exit 0
            fi
            sleep 10
          done
          echo 'v3.3.0 was not published within the dependency window' >&2
          exit 1

      - name: Create a clean branch from the released default branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B "$HEAD_BRANCH" origin/main
          test "$(sed -n 's/^Version:[[:space:]]*//p' VERSION.md | head -1)" = '3.3.0'

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes jq shellcheck
          python -m pip install --disable-pip-version-check -r requirements-controller.txt

      - name: Apply the bounded v3.4.0 semantic change set
        run: python /tmp/pathfinder-v340-prepare.py

      - name: Run the complete repository gate
        env:
          PATHFINDER_CONTROLLER_PYTHON: python
          PATHFINDER_DOCS_PYTHON: python
          PATHFINDER_EVAL_PYTHON: python
        run: bash scripts/check-all.sh .

      - name: Commit and smoke-test the exact package
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Add semantic Goal contracts and outcome evaluation for v3.4.0'
          bash scripts/package-smoke.sh .

      - name: Push and open the pull request
        id: pr
        shell: bash
        run: |
          set -euo pipefail
          git push --force-with-lease origin HEAD:"$HEAD_BRANCH"
          existing=$(gh pr list --repo "$REPO" --head "$HEAD_BRANCH" --state open --json number --limit 1 --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            number="$existing"
          else
            url=$(gh pr create --repo "$REPO" --base main --head "$HEAD_BRANCH" \
              --title 'Add semantic Goal contracts and outcome evaluation for v3.4.0' \
              --body-file - <<'EOF'
          ## Summary

          - adds schema v3 structured Goals and deterministic controller rendering
          - retains v1 and v2 artifact compatibility
          - replaces word matching with semantic live-result validation
          - adds no-change outcomes, disconfirmation, question value, adaptive verification, and reporting tiers
          - introduces a privacy-preserving Outcome Lab measurement format and CLI

          ## Verification

          - complete repository gate
          - exact committed package smoke test
          - protected-branch checks before merge
          EOF
            )
            number=${url##*/}
          fi
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - name: Wait for required checks and merge
        shell: bash
        run: |
          set -euo pipefail
          pr='${{ steps.pr.outputs.number }}'
          files=$(gh pr diff "$pr" --repo "$REPO" --name-only)
          ! grep -Eq '^\.github/(pathfinder-v340-prepare\.py|workflows/orchestrate-v340\.yml)$' <<<"$files"
          for attempt in $(seq 1 120); do
            checks=$(gh pr checks "$pr" --repo "$REPO" --json name,state,bucket 2>/dev/null || echo '[]')
            names=$(jq -r '.[].name' <<<"$checks")
            if grep -qx 'version + JSON consistency' <<<"$names" \
              && grep -qx 'CodeQL' <<<"$names" \
              && grep -qx 'CodeQL Actions' <<<"$names" \
              && grep -qx 'Dependency Review' <<<"$names"; then
              break
            fi
            sleep 10
          done
          gh pr checks "$pr" --repo "$REPO" --watch --fail-fast --interval 10
          gh pr merge "$pr" --repo "$REPO" --squash --delete-branch \
            --subject 'Add semantic Goal contracts and outcome evaluation for v3.4.0'

      - name: Dispatch and verify v3.4.0 release
        shell: bash
        run: |
          set -euo pipefail
          merged_sha=$(gh api "repos/$REPO/commits/main" --jq .sha)
          version=$(gh api "repos/$REPO/contents/VERSION.md?ref=main" --jq .content | base64 -d | sed -n 's/^Version:[[:space:]]*//p' | head -1)
          [ "$version" = "$VERSION" ]
          started=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          gh workflow run release.yml --repo "$REPO" --ref main -f version="$VERSION"
          run_id=''
          for attempt in $(seq 1 90); do
            runs=$(gh run list --repo "$REPO" --workflow release.yml --event workflow_dispatch --branch main --limit 10 --json databaseId,createdAt)
            run_id=$(jq -r --arg started "$started" '[.[] | select(.createdAt >= $started)] | sort_by(.createdAt) | last | .databaseId // empty' <<<"$runs")
            [ -n "$run_id" ] && break
            sleep 5
          done
          [ -n "$run_id" ]
          gh run watch "$run_id" --repo "$REPO" --exit-status
          gh release view "v$VERSION" --repo "$REPO" >/dev/null
          tag_sha=$(gh api "repos/$REPO/git/ref/tags/v$VERSION" --jq .object.sha)
          [ "$tag_sha" = "$merged_sha" ]

      - name: Record a diagnostic issue on failure
        if: failure()
        shell: bash
        run: |
          body="Workflow: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID

          The v3.4.0 pipeline stopped without force-merging or releasing a failing candidate. Review the failed step and logs before retrying."
          existing=$(gh issue list --repo "$REPO" --state open --search 'v3.4.0 pipeline blocked in:title' --json number --limit 1 --jq '.[0].number // empty' 2>/dev/null || true)
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$REPO" --body "$body" || true
          else
            gh issue create --repo "$REPO" --title 'v3.4.0 pipeline blocked' --body "$body" || true
          fi
