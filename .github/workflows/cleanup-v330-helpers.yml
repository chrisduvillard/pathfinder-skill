name: cleanup-v330-helpers

on:
  push:
    branches:
      - codex/pathfinder-hardening-outcomes
    paths:
      - .github/workflows/cleanup-v330-helpers.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: codex/pathfinder-hardening-outcomes
          fetch-depth: 0
      - name: Install controller dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-controller.txt
      - name: Require the reviewed implementation
        shell: bash
        run: |
          grep -Fq 'def _validate_committed_event_chain' pathfinder_core/storage.py
          test "$(grep -Fc 'self._validate_committed_event_chain(document)' pathfinder_core/storage.py)" -eq 2
          grep -Fq 'test_committed_event_chain_rejects_older_event_tampering' tests/core/test_state.py
          grep -Fq 'test_committed_event_chain_tip_is_bound_to_canonical_state' tests/core/test_state.py
          python -m unittest tests.core.test_state -v
          bash scripts/check-controller.sh .
      - name: Remove every temporary review helper
        shell: bash
        run: |
          rm -f .github/workflows/apply-chain-review-fix.yml
          rm -f .github/workflows/apply-chain-review-fix-v2.yml
          rm -f .github/workflows/finalize-chain-review.yml
          rm -f .github/workflows/cleanup-v330-helpers.yml
          git diff --check
      - name: Commit the clean reviewed tree
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          if git diff --cached --quiet; then
            echo 'No cleanup commit required.'
          else
            git diff --cached --check
            git commit -m 'Remove temporary v3.3.0 review helpers'
            git push origin HEAD:codex/pathfinder-hardening-outcomes
          fi
