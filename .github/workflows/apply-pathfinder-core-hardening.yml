name: apply-pathfinder-core-hardening

on:
  push:
    branches:
      - codex/pathfinder-hardening-core
    paths:
      - .github/workflows/apply-pathfinder-core-hardening.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Verify and apply audited patch
        shell: bash
        run: |
          set -euo pipefail
          cat .pathfinder-patch/part-* > "$RUNNER_TEMP/pathfinder-core.patch.gz.b64"
          base64 --decode "$RUNNER_TEMP/pathfinder-core.patch.gz.b64" > "$RUNNER_TEMP/pathfinder-core.patch.gz"
          gzip -dc "$RUNNER_TEMP/pathfinder-core.patch.gz" > "$RUNNER_TEMP/pathfinder-core.patch"
          printf '%s  %s\n' 'a66aaf4168c55bcfc9d1899f3fcb2daca0535e5987bbfff84e9f14fcde826568' "$RUNNER_TEMP/pathfinder-core.patch" | sha256sum --check
          git apply --check --whitespace=error-all "$RUNNER_TEMP/pathfinder-core.patch"
          git apply --whitespace=error-all "$RUNNER_TEMP/pathfinder-core.patch"
          rm -rf .pathfinder-patch .github/workflows/apply-pathfinder-core-hardening.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: harden mission integrity and read-only operations"
          git push origin HEAD:codex/pathfinder-hardening-core
