name: finalize-v330-v3

on:
  push:
    branches:
      - release/v3.3.0-final
    paths:
      - .github/workflows/finalize-v330-v3.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: release/v3.3.0-final
          fetch-depth: 0
      - name: Apply reviewed event-chain fix
        run: python .github/scripts/apply_v330_review_fix_v3.py
      - name: Remove temporary finalization files
        run: rm -f .github/workflows/finalize-v330-v3.yml .github/workflows/finalize-v330-v2.yml .github/workflows/finalize-v330.yml .github/workflows/apply-v330-review-fix.yml .github/scripts/apply_v330_review_fix.py .github/scripts/apply_v330_review_fix_v2.py .github/scripts/apply_v330_review_fix_v3.py .github/scripts/README.tmp .github/workflows/workflow-probe.txt
      - name: Validate generated source
        shell: bash
        run: |
          git diff --check
          python -m compileall -q pathfinder_core tests/core/test_state.py
      - name: Commit final reviewed changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git diff --cached --check
          git commit -m 'Validate the complete committed event chain'
          git push origin HEAD:release/v3.3.0-final
