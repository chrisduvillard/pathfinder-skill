name: export-source

on:
  push:
    branches:
      - export/v330-review-fix
    paths:
      - .github/workflows/export-source.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build source archive
        shell: bash
        run: tar --exclude=.git --exclude=.github/workflows/export-source.yml -czf "$RUNNER_TEMP/pathfinder-source.tgz" .
      - name: Upload source archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pathfinder-source
          path: ${{ runner.temp }}/pathfinder-source.tgz
          if-no-files-found: error
          retention-days: 1
