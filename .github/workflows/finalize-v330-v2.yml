name: finalize-v330-v2

on:
  push:
    branches:
      - release/v3.3.0-final
    paths:
      - .github/workflows/finalize-v330-v2.yml

permissions:
  contents: write

concurrency:
  group: finalize-v330-v2
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: release/v3.3.0-final
          fetch-depth: 0
      - name: Install controller dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-controller.txt
      - name: Apply reviewed event-chain fix
        run: python .github/scripts/apply_v330_review_fix_v2.py
      - name: Remove all temporary finalization files
        run: rm -f .github/workflows/finalize-v330-v2.yml .github/workflows/finalize-v330.yml .github/workflows/apply-v330-review-fix.yml .github/scripts/apply_v330_review_fix.py .github/scripts/apply_v330_review_fix_v2.py .github/workflows/workflow-probe.txt
      - name: Run focused and complete controller suites
        shell: bash
        run: |
          git diff --check
          python -m unittest tests.core.test_state -v
          bash scripts/check-controller.sh .
      - name: Commit final reviewed changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git diff --cached --check
          git commit -m 'Validate the complete committed event chain'
          git push origin HEAD:release/v3.3.0-final
