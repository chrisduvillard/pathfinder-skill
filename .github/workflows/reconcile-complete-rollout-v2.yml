name: reconcile-complete-rollout-v2

on:
  push:
    branches: [codex/pathfinder-hardening-outcomes]
    paths: [.github/workflows/reconcile-complete-rollout-v2.yml]

permissions:
  actions: write
  checks: read
  contents: write
  issues: write
  pull-requests: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: codex/pathfinder-hardening-outcomes
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Reconcile the three releases sequentially
        shell: bash
        run: |
          set -euo pipefail

          release_exists() {
            gh release view "v$1" --repo "$REPO" >/dev/null 2>&1
          }

          find_open_pr() {
            local prefix="$1" preferred="$2" number
            number=$(gh pr list --repo "$REPO" --head "$preferred" --state open --json number --limit 1 --jq '.[0].number // empty' 2>/dev/null || true)
            if [ -n "$number" ]; then
              printf '%s' "$number"
              return
            fi
            gh pr list --repo "$REPO" --state open --limit 100 --json number,headRefName \
              --jq ".[] | select(.headRefName | startswith(\"$prefix\")) | [.number, .headRefName] | @tsv" \
              | sort -k2,2V | tail -1 | cut -f1
          }

          wait_for_pr() {
            local version="$1" prefix="$2" preferred="$3" number=''
            for attempt in $(seq 1 360); do
              if release_exists "$version"; then
                printf '%s' 'released'
                return
              fi
              number=$(find_open_pr "$prefix" "$preferred")
              if [ -n "$number" ]; then
                printf '%s' "$number"
                return
              fi
              sleep 10
            done
            echo "timed out waiting for v$version PR" >&2
            return 1
          }

          require_registered_checks() {
            local pr="$1" checks names
            for attempt in $(seq 1 240); do
              checks=$(gh pr checks "$pr" --repo "$REPO" --json name,state,bucket 2>/dev/null || echo '[]')
              names=$(jq -r '.[].name' <<<"$checks")
              if grep -qx 'version + JSON consistency' <<<"$names" \
                && grep -qx 'CodeQL' <<<"$names" \
                && grep -qx 'CodeQL Actions' <<<"$names" \
                && grep -qx 'Dependency Review' <<<"$names"; then
                return
              fi
              sleep 10
            done
            echo "required contexts never registered for PR $pr" >&2
            return 1
          }

          validate_candidate() {
            local pr="$1" expected_version="$2" files
            files=$(gh pr diff "$pr" --repo "$REPO" --name-only)
            if grep -Eq '^\.github/(pathfinder-v3(30|40|50)-|workflows/(prepare|orchestrate|finalize|export|cancel|verify-final|publish-rollout|cleanup-rollout|reconcile-complete))' <<<"$files"; then
              echo "temporary rollout file found in PR $pr" >&2
              return 1
            fi
            grep -qx 'VERSION.md' <<<"$files"
            gh pr diff "$pr" --repo "$REPO" | grep -Eq "^\+Version:[[:space:]]+$expected_version[[:space:]]*$"
          }

          dispatch_release() {
            local version="$1" merged_sha="$2" started run_id runs tag_sha
            started=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            gh workflow run release.yml --repo "$REPO" --ref main -f version="$version"
            run_id=''
            for attempt in $(seq 1 120); do
              runs=$(gh run list --repo "$REPO" --workflow release.yml --event workflow_dispatch --branch main --limit 20 --json databaseId,createdAt)
              run_id=$(jq -r --arg started "$started" '[.[] | select(.createdAt >= $started)] | sort_by(.createdAt) | last | .databaseId // empty' <<<"$runs")
              [ -n "$run_id" ] && break
              sleep 5
            done
            [ -n "$run_id" ]
            gh run watch "$run_id" --repo "$REPO" --exit-status
            gh release view "v$version" --repo "$REPO" --json tagName,isDraft,isPrerelease > /tmp/release.json
            jq -e --arg tag "v$version" '.tagName == $tag and .isDraft == false and .isPrerelease == false' /tmp/release.json >/dev/null
            tag_sha=$(gh api "repos/$REPO/git/ref/tags/v$version" --jq .object.sha)
            [ "$tag_sha" = "$merged_sha" ]
          }

          merge_and_release() {
            local version="$1" prefix="$2" preferred="$3" subject="$4" pr main_version merged_sha
            if release_exists "$version"; then
              echo "v$version already released"
              return
            fi
            pr=$(wait_for_pr "$version" "$prefix" "$preferred")
            if [ "$pr" != 'released' ]; then
              validate_candidate "$pr" "$version"
              require_registered_checks "$pr"
              gh pr checks "$pr" --repo "$REPO" --watch --fail-fast --interval 10
              gh pr merge "$pr" --repo "$REPO" --squash --delete-branch --subject "$subject"
            fi
            main_version=$(gh api "repos/$REPO/contents/VERSION.md?ref=main" --jq .content | base64 -d | sed -n 's/^Version:[[:space:]]*//p' | head -1)
            [ "$main_version" = "$version" ]
            merged_sha=$(gh api "repos/$REPO/commits/main" --jq .sha)
            dispatch_release "$version" "$merged_sha"
          }

          merge_and_release '3.3.0' 'release/v3.3.0-' 'release/v3.3.0-ready3' \
            'Harden mission integrity and read-only operations for v3.3.0'
          merge_and_release '3.4.0' 'release/v3.4.0-' 'release/v3.4.0-ready2' \
            'Add semantic Goal contracts and outcome evaluation for v3.4.0'
          merge_and_release '3.5.0' 'release/v3.5.0-' 'release/v3.5.0-ready7' \
            'Add progressive policy-driven architecture and quality gates for v3.5.0'

      - name: Fetch the final default branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "+refs/heads/main:refs/remotes/origin/main" --tags --force
          git checkout -B final-verification origin/main
          test "$(sed -n 's/^Version:[[:space:]]*//p' VERSION.md | head -1)" = '3.5.0'

      - name: Install final verification dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes jq shellcheck
          python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Re-run complete product, package, wheel, and host gates
        env:
          PATHFINDER_CONTROLLER_PYTHON: python
          PATHFINDER_DOCS_PYTHON: python
          PATHFINDER_EVAL_PYTHON: python
        run: |
          set -euo pipefail
          bash scripts/check-all.sh .
          bash scripts/package-smoke.sh .
          bash scripts/check-wheel.sh .
          bash scripts/check-host-installs.sh .

      - name: Verify ancestry and build the machine-readable attestation
        shell: bash
        run: |
          set -euo pipefail
          main_sha=$(git rev-parse HEAD)
          previous=''
          releases='[]'
          for version in 3.3.0 3.4.0 3.5.0; do
            tag="v$version"
            tag_sha=$(git rev-list -n 1 "$tag")
            [ -n "$tag_sha" ]
            if [ -n "$previous" ]; then
              git merge-base --is-ancestor "$previous" "$tag_sha"
            fi
            previous="$tag_sha"
            release=$(gh release view "$tag" --repo "$REPO" --json tagName,url,isDraft,isPrerelease,publishedAt,targetCommitish)
            releases=$(jq --argjson item "$release" '. + [$item]' <<<"$releases")
          done
          [ "$previous" = "$main_sha" ]
          generated_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          jq -n \
            --arg main_sha "$main_sha" \
            --arg generated_at "$generated_at" \
            --arg workflow_run "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --argjson releases "$releases" \
            '{schema_version:1,project:"chrisduvillard/pathfinder-skill",final_version:"3.5.0",main_sha:$main_sha,releases:$releases,verification:{repository_gate:"passed",package_smoke:"passed",wheel_installation:"passed",credential_free_host_installation:"passed",tag_ancestry:"passed",marketplace_version_alignment:"passed"},workflow_run:$workflow_run,generated_at:$generated_at}' \
            > /tmp/pathfinder-rollout-attestation.json

      - name: Publish attestation and clean rollout branches
        shell: bash
        run: |
          set -euo pipefail
          git checkout --orphan rollout-attestation
          git rm -rf .
          cp /tmp/pathfinder-rollout-attestation.json ./pathfinder-rollout-attestation.json
          git add pathfinder-rollout-attestation.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Attest verified Pathfinder v3.5.0 rollout'
          git push --force origin HEAD:attestations/pathfinder-v3.5.0

          for prefix in release/v3.3.0 release/v3.4.0 release/v3.5.0; do
            gh pr list --repo "$REPO" --state open --limit 100 --json number,headRefName \
              --jq ".[] | select(.headRefName | startswith(\"$prefix\")) | .number" \
              | while read -r number; do
                  [ -n "$number" ] || continue
                  gh pr close "$number" --repo "$REPO" --comment 'Closed after the verified staged rollout completed.' || true
                done
            encoded_prefix=$(python - "$prefix" <<'PY'
import sys, urllib.parse
print(urllib.parse.quote(sys.argv[1], safe=''))
PY
)
            gh api "repos/$REPO/git/matching-refs/heads/$encoded_prefix" --paginate --jq '.[].ref' \
              | while read -r ref; do gh api --method DELETE "repos/$REPO/git/$ref" || true; done
          done
          gh api --method DELETE "repos/$REPO/git/refs/heads/codex/pathfinder-hardening-outcomes" || true

      - name: Record a closed success issue
        shell: bash
        run: |
          sha=$(git show rollout-attestation:pathfinder-rollout-attestation.json | jq -r .main_sha)
          url=$(gh issue create --repo "$REPO" --title 'Pathfinder v3.5.0 rollout verified' \
            --body "Pathfinder v3.3.0, v3.4.0, and v3.5.0 were merged and released sequentially. Final main commit: \`$sha\`. The repository, package, wheel, host-install, tag-ancestry, and marketplace-alignment gates all passed. The machine-readable attestation is on branch \`attestations/pathfinder-v3.5.0\`.")
          gh issue close "${url##*/}" --repo "$REPO" --reason completed

      - name: Record blocking evidence on failure
        if: failure()
        shell: bash
        run: |
          body="Workflow: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID

          The corrected reconciler stopped without bypassing protected checks or publishing a failing release. Review the failed step and linked logs."
          existing=$(gh issue list --repo "$REPO" --state open --search 'Pathfinder rollout reconciler blocked in:title' --json number --limit 1 --jq '.[0].number // empty' 2>/dev/null || true)
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$REPO" --body "$body" || true
          else
            gh issue create --repo "$REPO" --title 'Pathfinder rollout reconciler blocked' --body "$body" || true
          fi
