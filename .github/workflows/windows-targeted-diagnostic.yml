name: windows-targeted-diagnostic

on:
  push:
    branches:
      - codex/pathfinder-hardening-outcomes
    paths:
      - .github/workflows/windows-targeted-diagnostic.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install controller dependencies
        shell: pwsh
        run: python -m pip install --disable-pip-version-check -r requirements-controller.txt
      - name: Run affected tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          python -m unittest tests.core.test_repository tests.core.test_state tests.core.test_cache tests.core.test_capabilities tests.core.test_mission_views tests.core.test_artifacts -v 2>&1 | Tee-Object -FilePath targeted-tests.log
          $code = $LASTEXITCODE
          "exit_code=$code" | Out-File -FilePath targeted-tests-tail.txt
          Get-Content targeted-tests.log -Tail 300 | Out-File -FilePath targeted-tests-tail.txt -Append
          exit 0
      - name: Upload diagnostic log
        uses: actions/upload-artifact@v4
        with:
          name: windows-targeted-diagnostic
          path: |
            targeted-tests.log
            targeted-tests-tail.txt
          if-no-files-found: error
          retention-days: 1
