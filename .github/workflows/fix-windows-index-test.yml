name: fix-windows-index-test

on:
  push:
    branches:
      - codex/pathfinder-hardening-outcomes
    paths:
      - .github/workflows/fix-windows-index-test.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: codex/pathfinder-hardening-outcomes
          fetch-depth: 0
      - name: Make the Git index regression portable
        shell: bash
        run: |
          printf '%s' '' | base64 --decode | gzip --decompress > /tmp/fix-index.patch
          git apply --check /tmp/fix-index.patch
          git apply /tmp/fix-index.patch
          rm .github/workflows/fix-windows-index-test.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git diff --cached --check
          git commit -m 'Make the Git index regression portable'
          git push origin HEAD:codex/pathfinder-hardening-outcomes
