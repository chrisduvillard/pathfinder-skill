name: cleanup-rollout-branches

on:
  push:
    branches: [codex/pathfinder-hardening-outcomes]
    paths: [.github/workflows/cleanup-rollout-branches.yml]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - name: Wait for the verified v3.5.0 release
        run: |
          set -euo pipefail
          for attempt in $(seq 1 720); do
            if gh release view v3.5.0 --repo "$REPO" >/dev/null 2>&1; then
              exit 0
            fi
            sleep 10
          done
          exit 1

      - name: Close redundant rollout PRs and delete rollout branches
        run: |
          set -euo pipefail
          for prefix in release/v3.3.0 release/v3.4.0 release/v3.5.0; do
            gh pr list --repo "$REPO" --state open --json number,headRefName --limit 100 \
              --jq ".[] | select(.headRefName | startswith(\"$prefix\")) | .number" \
              | while read -r number; do
                  [ -n "$number" ] || continue
                  gh pr close "$number" --repo "$REPO" --comment 'Closed after the verified staged rollout completed.' || true
                done
          done
          gh api "repos/$REPO/git/matching-refs/heads/release/v3.3.0" --paginate --jq '.[].ref' \
            | while read -r ref; do gh api --method DELETE "repos/$REPO/git/$ref" || true; done
          gh api "repos/$REPO/git/matching-refs/heads/release/v3.4.0" --paginate --jq '.[].ref' \
            | while read -r ref; do gh api --method DELETE "repos/$REPO/git/$ref" || true; done
          gh api "repos/$REPO/git/matching-refs/heads/release/v3.5.0" --paginate --jq '.[].ref' \
            | while read -r ref; do gh api --method DELETE "repos/$REPO/git/$ref" || true; done
