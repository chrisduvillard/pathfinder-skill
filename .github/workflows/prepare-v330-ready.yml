name: prepare-v3.3.0-ready

on:
  push:
    branches: [codex/pathfinder-hardening-outcomes]
    paths: [.github/workflows/prepare-v330-ready.yml]

permissions:
  contents: write
  issues: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      SOURCE_BRANCH: release/v3.3.0-hardening
      READY_BRANCH: release/v3.3.0-ready
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: main

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Retrieve the bounded preparation program
        run: |
          gh api "repos/$REPO/contents/.github/pathfinder-v330-prepare.py?ref=$SOURCE_BRANCH" --jq .content | base64 -d > /tmp/pathfinder-v330-prepare.py
          test -s /tmp/pathfinder-v330-prepare.py

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes jq shellcheck
          python -m pip install --disable-pip-version-check -r requirements-controller.txt

      - name: Apply and verify v3.3.0
        env:
          PATHFINDER_CONTROLLER_PYTHON: python
          PATHFINDER_DOCS_PYTHON: python
          PATHFINDER_EVAL_PYTHON: python
        run: |
          git checkout -B "$READY_BRANCH" origin/main
          python /tmp/pathfinder-v330-prepare.py
          bash scripts/check-all.sh .
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Harden mission integrity and read-only operations for v3.3.0'
          bash scripts/package-smoke.sh .
          git push --force-with-lease origin HEAD:"$READY_BRANCH"

      - name: Record preparation failure
        if: failure()
        run: |
          gh issue create --repo "$REPO" --title 'v3.3.0 ready-branch preparation failed' \
            --body "Workflow: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID

          No pull request, merge, or release was attempted." || true
