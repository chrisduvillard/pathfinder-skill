name: windows-module-diagnostic

on:
  push:
    branches:
      - codex/pathfinder-hardening-outcomes
    paths:
      - .github/workflows/windows-module-diagnostic.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: windows-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        module:
          - test_repository
          - test_state
          - test_cache
          - test_capabilities
          - test_mission_views
          - test_artifacts
    steps:
      - uses: actions/checkout@v4
      - name: Install controller dependencies
        shell: pwsh
        run: python -m pip install --disable-pip-version-check -r requirements-controller.txt
      - name: Run module
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          python -m unittest "tests.core.${{ matrix.module }}" -v 2>&1 | Tee-Object -FilePath "${{ matrix.module }}.log"
          $code = $LASTEXITCODE
          "exit_code=$code" | Out-File -FilePath "${{ matrix.module }}-result.txt"
          Get-Content "${{ matrix.module }}.log" -Tail 200 | Out-File -FilePath "${{ matrix.module }}-result.txt" -Append
          exit 0
      - name: Upload module log
        uses: actions/upload-artifact@v4
        with:
          name: "windows-${{ matrix.module }}"
          path: |
            ${{ matrix.module }}.log
            ${{ matrix.module }}-result.txt
          if-no-files-found: error
          retention-days: 1
