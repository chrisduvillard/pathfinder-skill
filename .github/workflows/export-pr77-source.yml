name: export-pr77-source

on:
  push:
    branches:
      - export/pr77-clean-review-20260901
    paths:
      - .github/workflows/export-pr77-source.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Build source archive
        shell: bash
        run: tar --exclude=.git --exclude=.github/workflows/export-pr77-source.yml -czf "$RUNNER_TEMP/pathfinder-pr77-source.tgz" .
      - name: Upload source archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pathfinder-pr77-source
          path: ${{ runner.temp }}/pathfinder-pr77-source.tgz
          if-no-files-found: error
          retention-days: 1
